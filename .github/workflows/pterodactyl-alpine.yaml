name: "[pterodactyl-alpine] Force Build and Push"
on:
  workflow_dispatch:

env:
  #PLATFORMS: "linux/amd64,linux/arm64,linux/arm/v7"
  #PLATFORMS: "linux/amd64,linux/arm64"
  PLATFORMS: "linux/amd64"
  TAG: "1.8.0"

jobs:
  pterodactyl-alpine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: set lower case owner name
        run: |
          echo "GITHUB_REPO_OWNER_LC=${GITHUB_REPO_OWNER,,}" >>${GITHUB_ENV}
        env:
          GITHUB_REPO_OWNER: '${{ github.repository_owner }}'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.GITHUB_REPO_OWNER_LC }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push - pterodactyl [alpine]
        uses: docker/build-push-action@v6
        with:
          push: true
          file: alpine/Dockerfile.pterodactyl
          platforms: ${{ env.PLATFORMS }}
          #   tiltedevolution-pterodactyl
          #     latest
          #     {{ TAG }}
          #   tiltedevolution
          #     pterodactyl
          #     pterodactyl-latest
          #     pterodactyl-{{ TAG }}
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/tiltedevolution-pterodactyl:latest
            ${{ vars.DOCKERHUB_USERNAME }}/tiltedevolution-pterodactyl:${{ env.TAG }}
            ${{ vars.DOCKERHUB_USERNAME }}/tiltedevolution:pterodactyl
            ${{ vars.DOCKERHUB_USERNAME }}/tiltedevolution:pterodactyl-latest
            ${{ vars.DOCKERHUB_USERNAME }}/tiltedevolution:pterodactyl-${{ env.TAG }}
            ghcr.io/${{ env.GITHUB_REPO_OWNER_LC }}/tiltedevolution-pterodactyl:latest
            ghcr.io/${{ env.GITHUB_REPO_OWNER_LC }}/tiltedevolution-pterodactyl:${{ env.TAG }}
            ghcr.io/${{ env.GITHUB_REPO_OWNER_LC }}/tiltedevolution:pterodactyl
            ghcr.io/${{ env.GITHUB_REPO_OWNER_LC }}/tiltedevolution:pterodactyl-latest
            ghcr.io/${{ env.GITHUB_REPO_OWNER_LC }}/tiltedevolution:pterodactyl-${{ env.TAG }}
          build-args: |
            VERSION=${{ env.TAG }}
